<title>Migrar fotos de AMH</title>

body{background:#0a0a0a;color:#f4f4f4;font-family:system-ui,sans-serif;padding:20px;max-width:600px;margin:0 auto;}

.ok{color:#4ade80;}
.err{color:#e8352a;}
.field{margin-bottom:10px;}
label{font-size:.7rem;color:#8d8d8d;display:block;margin-bottom:4px;}
input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;box-sizing:border-box;}
</style>
</head>
<body>
<h1>Migrar fotos de AMH a tu Supabase</h1>
<div class="card">

</div>

<div class="card">

    <label>Tu Project URL (Supabase nuevo)</label>

    <label>Tu Secret Key (la que empieza con sb_secret_...)</label>

  </div>
  <button id="btnStart">Empezar migración</button>
</div>

<div class="card">

</div>

const STORE_ID = 3;

document.getElementById('btnStart').onclick = async function(){
  const sbUrl = document.getElementById('sbUrl').value.trim().replace(/\/$/,'');
  const sbKey = document.getElementById('sbKey').value.trim();
  if (!sbKey){ alert('Pega tu Secret Key'); return; }
  this.disabled = true;
  this.textContent = 'Migrando...';

  const log = document.getElementById('log');
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');
  let ok = 0, fail = 0;

  const updates = [];

  for (let i=0; i<ITEMS.length; i++){
    const item = ITEMS[i];
    const pct = Math.round(((i+1)/ITEMS.length)*100);
    fill.style.width = pct+'%';
    fill.textContent = pct+'%';
    status.textContent = 'Foto '+(i+1)+' de '+ITEMS.length+' (producto id '+item.legacy_id+')';

    try{
      const imgRes = await fetch(item.url);
      if (!imgRes.ok) throw new Error('no se pudo bajar la foto original');
      const blob = await imgRes.blob();

      const ext = item.url.split('.').pop().split('?')[0] || 'jpg';
      const path = STORE_ID + '/' + Date.now() + '_' + item.legacy_id + '.' + ext;

      const upRes = await fetch(sbUrl+'/storage/v1/object/store-products/'+path, {
        method: 'POST',
        headers: {
          'apikey': sbKey,
          'Authorization': 'Bearer '+sbKey,
          'Content-Type': blob.type || 'image/jpeg'
        },
        body: blob
      });
      if (!upRes.ok) throw new Error('no se pudo subir: '+await upRes.text());

      const newUrl = sbUrl+'/storage/v1/object/public/store-products/'+path;
      updates.push({legacy_id: item.legacy_id, new_url: newUrl});

      log.innerHTML += '<div class="ok">✓ id '+item.legacy_id+' migrada</div>';
      ok++;
    } catch(e){
      log.innerHTML += '<div class="err">✕ id '+item.legacy_id+': '+e.message+'</div>';
      fail++;
    }
    log.scrollTop = log.scrollHeight;
  }

  status.textContent = 'Listo: '+ok+' migradas, '+fail+' fallaron.';

  // Generar el SQL final para actualizar la base de datos
  let sql = "-- Ejecuta esto en tu SQL Editor para apuntar los productos a las fotos nuevas\n\n";
  updates.forEach(u => {
    sql += "update products set images = ARRAY['"+u.new_url+"'], image_url = '"+u.new_url+"' "
         + "where store_id = 3 and legacy_id = "+u.legacy_id+";\n";
  });

  const blob2 = new Blob([sql], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob2);
  a.download = 'actualizar-fotos-amh.sql';
  a.textContent = '⬇️ Descargar el SQL para actualizar la base de datos';
  a.style.cssText = 'display:block;background:#111;border:1px solid #333;color:#4ade80;padding:14px;border-radius:8px;text-align:center;margin-top:14px;text-decoration:none;';
  document.body.appendChild(a);

  this.textContent = 'Migración completa';
};
</script>
