<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MOLDE DE CATÁLOGO · ZERUFY STUDIO
   Los colores salen de la base de datos (color_primary, color_bg)
   ============================================================ */
:root{
  --red:#e8352a; --bg:#0a0a0a; --panel:#141414; --panel2:#1b1b1b;
  --ink:#f4f4f4; --muted:#8d8d8d; --line:#2a2a2a; --ok:#4ade80;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:dark}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Montserrat',system-ui,sans-serif;line-height:1.5;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  padding-bottom:90px;
}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:50;background:rgba(10,10,10,.94);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:14px 16px calc(14px + env(safe-area-inset-top,0)) ;
  padding-top:calc(14px + env(safe-area-inset-top,0));
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;width:auto;object-fit:contain}
.brand .nm{
  font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:1.5px;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hbtns{display:flex;align-items:center;gap:8px;flex-shrink:0}
.iconbtn{
  width:38px;height:38px;border-radius:50%;background:var(--panel);
  display:grid;place-items:center;font-size:16px;border:1px solid var(--line);
}
.lang{font-size:11px;font-weight:700;letter-spacing:1px}

/* buscador */
.searchwrap{margin-top:12px;position:relative;display:none}
.searchwrap.on{display:block}
.searchwrap input{
  width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:24px;padding:11px 16px 11px 40px;color:var(--ink);outline:none;
}
.searchwrap input:focus{border-color:var(--red)}
.searchwrap .mag{position:absolute;left:14px;top:11px;color:var(--muted);font-size:15px}

/* categorías */
.cats{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  padding:8px 15px;border-radius:20px;background:var(--panel);
  border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;
}
.cat.on{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- GRID ---------- */
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){
  .grid{grid-template-columns:repeat(4,1fr)}
  main{max-width:1100px;margin:0 auto}
}

.card{background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative}
.card .ph{position:relative;aspect-ratio:1;background:#0f0f0f;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card.out .ph img{filter:grayscale(1);opacity:.4}

.tags{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:5px;z-index:2}
.tag{
  font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  padding:4px 8px;border-radius:4px;background:var(--red);color:#fff;
}
.tag.new{background:var(--ok);color:#062d16}
.tag.off{background:#fff;color:#000}

.outbadge{
  position:absolute;inset:0;display:grid;place-items:center;z-index:3;
  font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;
  color:#fff;background:rgba(0,0,0,.45);
}
.outbadge span{border:2px solid #fff;padding:5px 13px;border-radius:4px;transform:rotate(-7deg)}

.card .info{padding:11px 12px 13px}
.card .nm{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{display:flex;align-items:baseline;gap:7px}
.card .pr .now{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:.5px}
.card .pr .was{font-size:12px;color:var(--muted);text-decoration:line-through}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--ink);margin-bottom:6px;letter-spacing:1px}

.skel{background:var(--panel);border-radius:14px;overflow:hidden}
.skel .b{aspect-ratio:1;background:linear-gradient(90deg,#141414,#1e1e1e,#141414);
  background-size:200% 100%;animation:sh 1.3s infinite}
.skel .t{height:38px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- BARRA DEL CARRITO ---------- */
.cartbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(10,10,10,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));
  transform:translateY(120%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
}
.cartbar.on{transform:translateY(0)}
.cartbar button{
  width:100%;background:var(--red);color:#fff;font-weight:700;font-size:15px;
  padding:15px;border-radius:50px;display:flex;align-items:center;justify-content:center;gap:10px;
}
.cartbar .count{background:rgba(0,0,0,.28);border-radius:20px;padding:2px 9px;font-size:13px}

/* ---------- MODALES ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.sheet .pn{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0));
  animation:up .3s cubic-bezier(.2,.85,.25,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;background:#3a3a3a;border-radius:3px;margin:10px auto 4px}
.shead{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 14px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:2;
}
.shead h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1.2px;text-transform:uppercase}
.x{width:32px;height:32px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:15px}

/* galería */
.gal{position:relative;background:#0f0f0f}
.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gtrack::-webkit-scrollbar{display:none}
.gtrack img{min-width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.dot.on{background:#fff;width:18px;border-radius:3px}

.dbody{padding:18px}
.dbody h2{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:1px;line-height:1.05;margin-bottom:8px}
.dprice{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.dprice .now{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--red);letter-spacing:1px}
.dprice .was{font-size:15px;color:var(--muted);text-decoration:line-through}
.desc{color:#c4c4c4;font-size:14px;margin-bottom:16px;white-space:pre-line}
.meas{font-size:12.5px;color:var(--muted);margin-bottom:16px;padding:11px 14px;background:var(--panel);border-radius:10px}

.lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:9px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.size{
  min-width:50px;padding:11px 15px;border-radius:9px;background:var(--panel);
  border:1.5px solid var(--line);font-size:13.5px;font-weight:600;text-align:center;
}
.size.on{border-color:var(--red);background:rgba(232,53,42,.12)}
.size:disabled{opacity:.3;text-decoration:line-through}

.add{
  width:100%;background:var(--red);color:#fff;font-weight:700;font-size:15.5px;
  padding:16px;border-radius:50px;
}
.add:disabled{background:var(--panel);color:var(--muted)}
.notify{
  width:100%;background:transparent;border:1.5px solid var(--red);color:var(--red);
  font-weight:700;font-size:14.5px;padding:14px;border-radius:50px;margin-top:10px;
}

/* carrito */
.citem{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.citem img{width:62px;height:62px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#111}
.citem .m{flex:1;min-width:0}
.citem .n{font-size:13.5px;font-weight:600;line-height:1.3}
.citem .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.citem .p{font-family:'Bebas Neue',sans-serif;font-size:18px;margin-top:5px;letter-spacing:.5px}
.qty{display:flex;align-items:center;gap:11px;margin-top:7px}
.qty button{width:26px;height:26px;border-radius:7px;background:var(--panel2);font-size:15px;display:grid;place-items:center}
.qty span{font-size:13.5px;font-weight:600;min-width:16px;text-align:center}
.rm{color:var(--muted);font-size:11.5px;text-decoration:underline;margin-top:6px}

.tot{padding:18px;border-top:1px solid var(--line)}
.totrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.totrow .l{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.totrow .v{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px}

/* opciones de entrega */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.opt{
  background:var(--panel);border:1.5px solid var(--line);border-radius:13px;
  padding:15px 12px;text-align:center;transition:border-color .15s;
}
.opt.on{border-color:var(--red);background:rgba(232,53,42,.09)}
.opt .ic{font-size:22px;margin-bottom:6px}
.opt .ti{font-size:13.5px;font-weight:700;margin-bottom:2px}
.opt .su{font-size:11px;color:var(--muted);line-height:1.3}
.hide{display:none}

/* formulario de pedido */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{
  width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:11px;
  padding:13px 15px;color:var(--ink);outline:none;
}
.field input:focus,.field textarea:focus{border-color:var(--red)}
.field textarea{min-height:78px;resize:vertical}
.err{color:var(--red);font-size:12px;margin-top:5px;display:none}
.err.on{display:block}

.note{background:var(--panel2);border-left:3px solid var(--red);border-radius:10px;
  padding:13px 15px;font-size:12.5px;color:var(--muted);margin-bottom:16px}

.done{text-align:center;padding:34px 22px}
.done .ok{width:66px;height:66px;border-radius:50%;background:rgba(74,222,128,.13);
  display:grid;place-items:center;font-size:32px;margin:0 auto 18px}
.done h3{font-family:'Bebas Neue',sans-serif;font-size:29px;letter-spacing:1px;margin-bottom:8px}
.done .num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--red);letter-spacing:2px;margin:14px 0}
.done p{color:var(--muted);font-size:14px;margin-bottom:22px}

.spin{width:17px;height:17px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:rot .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand" id="brand"></div>
    <div class="hbtns">
      <button class="iconbtn" id="btnSearch">🔍</button>
      <button class="iconbtn lang" id="btnLang">ES</button>
    </div>
  </div>
  <div class="searchwrap" id="searchWrap">
    <span class="mag">🔍</span>
    <input type="text" id="q" placeholder="Buscar producto...">
  </div>
  <div class="cats" id="cats"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="cartbar" id="cartbar">
  <button id="btnCart">
    <span id="cartLabel">Ver pedido</span>
    <span class="count" id="cartCount">0</span>
  </button>
</div>

<!-- DETALLE -->
<div class="sheet" id="shProd">
  <div class="bd" data-close></div>
  <div class="pn">
    <div class="grab"></div>
    <div class="shead"><h3 id="pTitle">Producto</h3><button class="x" data-close>✕</button></div>
    <div id="pBody"></div>
  </div>
</div>

<!-- CARRITO -->
<div class="sheet" id="shCart">
  <div class="bd" data-close></div>
  <div class="pn">
    <div class="grab"></div>
    <div class="shead"><h3 id="cTitle">Tu pedido</h3><button class="x" data-close>✕</button></div>
    <div id="cBody"></div>
  </div>
</div>

<!-- DATOS DE ENVÍO -->
<div class="sheet" id="shForm">
  <div class="bd" data-close></div>
  <div class="pn">
    <div class="grab"></div>
    <div class="shead"><h3 id="fTitle">Tus datos</h3><button class="x" data-close>✕</button></div>
    <div id="fBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIGURACIÓN · lo único que cambias por cliente
   ============================================================ */
const STORE_ID     = 2;
const SUPABASE_URL = 'https://drkcstmcdscklcrefxbs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_k4jAuf7UCzpT_kp2jSpW-A_1ICXHA2s';
/* ============================================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const T = {
  es:{search:'Buscar producto...',all:'Todos',cart:'Ver pedido',yourOrder:'Tu pedido',
      empty:'Tu pedido está vacío',emptySub:'Agrega productos para continuar',
      noProd:'Sin resultados',noProdSub:'Prueba con otra búsqueda',
      size:'Talla',add:'Agregar al pedido',pickSize:'Elige una talla',
      soldout:'Agotado',notify:'Avísame cuando llegue',total:'Total',
      checkout:'Continuar',remove:'Quitar',yourData:'Tus datos',
      name:'Nombre completo',phone:'Teléfono',addr:'Dirección de envío',
      addrPh:'Calle, ciudad, estado y código postal',
      how:'¿Cómo lo quieres recibir?',ship:'Envío',shipSub:'A tu dirección',
      pick:'Personal',pickSub:'Lo coordinamos',
      reqHow:'Elige cómo lo quieres recibir',
      pickNote:'Coordinamos el lugar y la hora por WhatsApp.',
      send:'Enviar pedido',sending:'Enviando...',
      noteTxt:'Tu pedido queda registrado con un número. Después coordinamos el pago por WhatsApp.',
      done:'¡Pedido recibido!',doneSub:'Guarda tu número de pedido. Ahora te llevamos a WhatsApp para coordinar el pago.',
      toWa:'Continuar en WhatsApp',reqName:'Escribe tu nombre',reqPhone:'Escribe tu teléfono',
      reqAddr:'Escribe tu dirección',failed:'No se pudo enviar. Intenta de nuevo.',
      off:'OFERTA',new:'NUEVO',hot:'DESTACADO'},
  en:{search:'Search products...',all:'All',cart:'View order',yourOrder:'Your order',
      empty:'Your order is empty',emptySub:'Add products to continue',
      noProd:'No results',noProdSub:'Try another search',
      size:'Size',add:'Add to order',pickSize:'Pick a size',
      soldout:'Sold out',notify:'Notify me when available',total:'Total',
      checkout:'Continue',remove:'Remove',yourData:'Your details',
      name:'Full name',phone:'Phone',addr:'Shipping address',
      addrPh:'Street, city, state and zip code',
      how:'How do you want it?',ship:'Shipping',shipSub:'To your address',
      pick:'In person',pickSub:'We arrange it',
      reqHow:'Choose how you want it',
      pickNote:'We arrange the place and time on WhatsApp.',
      send:'Send order',sending:'Sending...',
      noteTxt:'Your order gets a number. We\'ll coordinate payment on WhatsApp next.',
      done:'Order received!',doneSub:'Save your order number. We\'ll take you to WhatsApp to arrange payment.',
      toWa:'Continue on WhatsApp',reqName:'Enter your name',reqPhone:'Enter your phone',
      reqAddr:'Enter your address',failed:'Could not send. Try again.',
      off:'SALE',new:'NEW',hot:'FEATURED'}
};

let deliveryMode = null;
let lang='es', store=null, cats=[], prods=[], variants={},
    cat='all', query='', cart=[], current=null, currentSize=null;

const t = k => T[lang][k];
const money = n => '$' + Number(n||0).toFixed(2).replace(/\.00$/,'');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- CARGA ---------- */
async function load(){
  skeleton();
  try{
    const [st,ct,pr] = await Promise.all([
      sb.from('stores').select('*').eq('id',STORE_ID).single(),
      sb.from('categories').select('*').eq('store_id',STORE_ID).order('position'),
      sb.from('products').select('*').eq('store_id',STORE_ID).order('position')
    ]);
    if(st.error) throw st.error;
    store = st.data;
    cats  = ct.data || [];
    prods = (pr.data || []).filter(p => !p.hidden);

    const vr = await sb.from('product_variants').select('*').eq('store_id',STORE_ID).order('position');
    (vr.data||[]).forEach(v=>{ (variants[v.product_id] ||= []).push(v); });

    theme(); brand(); renderCats(); render();
  }catch(e){
    console.error(e);
    document.getElementById('grid').innerHTML =
      `<div class="empty" style="grid-column:1/-1"><div class="big">Error</div><div>No se pudo cargar el catálogo</div></div>`;
  }
}

function theme(){
  if(store.color_primary) document.documentElement.style.setProperty('--red',store.color_primary);
  if(store.color_bg){
    document.documentElement.style.setProperty('--bg',store.color_bg);
    document.body.style.background = store.color_bg;
  }
  document.title = store.name || 'Catálogo';
}

function brand(){
  document.getElementById('brand').innerHTML =
    (store.logo_url ? `<img src="${esc(store.logo_url)}" alt="">` : '') +
    `<span class="nm">${esc(store.name||'')}</span>`;
}

function skeleton(){
  document.getElementById('grid').innerHTML =
    Array(6).fill('<div class="skel"><div class="b"></div><div class="t"></div></div>').join('');
}

/* ---------- CATEGORÍAS ---------- */
function renderCats(){
  const el = document.getElementById('cats');
  el.innerHTML = `<button class="cat ${cat==='all'?'on':''}" data-c="all">${t('all')}</button>` +
    cats.map(c=>`<button class="cat ${cat==c.id?'on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
  el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    cat = b.dataset.c==='all' ? 'all' : Number(b.dataset.c);
    renderCats(); render();
  });
}

/* ---------- GRID ---------- */
function visible(){
  return prods.filter(p=>{
    if(cat!=='all' && p.category_id!=cat) return false;
    if(query){
      const q=query.toLowerCase();
      if(!(p.name||'').toLowerCase().includes(q) &&
         !(p.description||'').toLowerCase().includes(q) &&
         !(p.subcategoria||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const list = visible(), g = document.getElementById('grid');
  if(!list.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="big">${t('noProd')}</div><div>${t('noProdSub')}</div></div>`;
    return;
  }
  g.innerHTML = list.map(p=>{
    const out = p.sold_out;
    const img = (p.images && p.images[0]) || p.image_url || '';
    const off = p.discount_price && p.discount_price < p.price;
    const tags = [
      off ? `<span class="tag off">${t('off')}</span>` : '',
      p.is_new ? `<span class="tag new">${t('new')}</span>` : '',
      p.featured ? `<span class="tag">${t('hot')}</span>` : ''
    ].join('');
    return `<div class="card ${out?'out':''}" data-id="${p.id}">
      <div class="ph">
        ${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:''}
        <div class="tags">${tags}</div>
        ${out?`<div class="outbadge"><span>${t('soldout')}</span></div>`:''}
      </div>
      <div class="info">
        <div class="nm">${esc(p.name)}</div>
        <div class="pr">
          <span class="now">${money(off?p.discount_price:p.price)}</span>
          ${off?`<span class="was">${money(p.price)}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  g.querySelectorAll('.card').forEach(c=>c.onclick=()=>openProd(Number(c.dataset.id)));
}

/* ---------- DETALLE ---------- */
function openProd(id){
  const p = prods.find(x=>x.id===id); if(!p) return;
  current = p; currentSize = null;

  const imgs = (p.images && p.images.length) ? p.images : (p.image_url?[p.image_url]:[]);
  const off  = p.discount_price && p.discount_price < p.price;
  const vs   = variants[p.id] || [];
  const sizes = vs.length ? vs.map(v=>({label:v.size,stock:v.stock,id:v.id}))
                          : (p.sizes||[]).map(s=>({label:s,stock:null,id:null}));
  const desc = (lang==='es' && p.description_es) ? p.description_es : p.description;

  document.getElementById('pTitle').textContent = p.name;
  document.getElementById('pBody').innerHTML = `
    ${imgs.length?`<div class="gal">
      <div class="gtrack" id="gt">${imgs.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>
      ${imgs.length>1?`<div class="dots" id="dots">${imgs.map((_,i)=>`<span class="dot ${i?'':'on'}"></span>`).join('')}</div>`:''}
    </div>`:''}
    <div class="dbody">
      <h2>${esc(p.name)}</h2>
      <div class="dprice">
        <span class="now">${money(off?p.discount_price:p.price)}</span>
        ${off?`<span class="was">${money(p.price)}</span>`:''}
      </div>
      ${desc?`<div class="desc">${esc(desc)}</div>`:''}
      ${p.medidas?`<div class="meas">${esc(p.medidas)}</div>`:''}
      ${sizes.length?`<div class="lbl">${t('size')}</div>
        <div class="sizes" id="sz">${sizes.map(s=>
          `<button class="size" data-s="${esc(s.label)}" ${s.stock===0?'disabled':''}>${esc(s.label)}</button>`
        ).join('')}</div>`:''}
      ${p.sold_out
        ? `<button class="add" disabled>${t('soldout')}</button>
           <button class="notify" id="btnNotify">${t('notify')}</button>`
        : `<button class="add" id="btnAdd">${t('add')}</button>`}
    </div>`;

  const gt = document.getElementById('gt');
  if(gt && imgs.length>1){
    gt.onscroll = ()=>{
      const i = Math.round(gt.scrollLeft / gt.clientWidth);
      document.querySelectorAll('#dots .dot').forEach((d,j)=>d.classList.toggle('on',j===i));
    };
  }
  document.querySelectorAll('#sz .size').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#sz .size').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); currentSize = b.dataset.s;
  });
  const add = document.getElementById('btnAdd');
  if(add) add.onclick = ()=>{
    if(sizes.length && !currentSize){
      add.textContent = t('pickSize');
      setTimeout(()=>add.textContent=t('add'),1400); return;
    }
    addToCart(p, currentSize); close('shProd');
  };
  const nb = document.getElementById('btnNotify');
  if(nb) nb.onclick = ()=>{
    const msg = encodeURIComponent(`Hola! Me interesa "${p.name}". ¿Cuándo vuelve a estar disponible?`);
    window.open(`https://wa.me/${store.whatsapp}?text=${msg}`,'_blank');
  };
  open('shProd');
}

/* ---------- CARRITO ---------- */
function addToCart(p,size){
  const price = (p.discount_price && p.discount_price<p.price) ? p.discount_price : p.price;
  const key = p.id+'|'+(size||'');
  const ex = cart.find(i=>i.key===key);
  if(ex) ex.qty++;
  else cart.push({key,id:p.id,name:p.name,size:size||null,price:Number(price),qty:1,
                  img:(p.images&&p.images[0])||p.image_url||''});
  saveCart();
}
function saveCart(){
  const n = cart.reduce((a,i)=>a+i.qty,0);
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartLabel').textContent = t('cart');
  document.getElementById('cartbar').classList.toggle('on', n>0);
}
const total = ()=>cart.reduce((a,i)=>a+i.price*i.qty,0);

function openCart(){
  document.getElementById('cTitle').textContent = t('yourOrder');
  const b = document.getElementById('cBody');
  if(!cart.length){
    b.innerHTML = `<div class="empty"><div class="big">${t('empty')}</div><div>${t('emptySub')}</div></div>`;
  }else{
    b.innerHTML = cart.map(i=>`
      <div class="citem">
        ${i.img?`<img src="${esc(i.img)}" alt="">`:'<div style="width:62px;height:62px;border-radius:9px;background:#111"></div>'}
        <div class="m">
          <div class="n">${esc(i.name)}</div>
          ${i.size?`<div class="s">${t('size')}: ${esc(i.size)}</div>`:''}
          <div class="p">${money(i.price*i.qty)}</div>
          <div class="qty">
            <button data-m="-" data-k="${i.key}">−</button>
            <span>${i.qty}</span>
            <button data-m="+" data-k="${i.key}">+</button>
          </div>
          <div class="rm" data-rm="${i.key}">${t('remove')}</div>
        </div>
      </div>`).join('') + `
      <div class="tot">
        <div class="totrow"><span class="l">${t('total')}</span><span class="v">${money(total())}</span></div>
        <button class="add" id="btnCheckout">${t('checkout')}</button>
      </div>`;
    b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{
      const it = cart.find(i=>i.key===x.dataset.k);
      if(x.dataset.m==='+') it.qty++; else it.qty--;
      if(it.qty<=0) cart = cart.filter(i=>i.key!==x.dataset.k);
      saveCart(); openCart();
    });
    b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{
      cart = cart.filter(i=>i.key!==x.dataset.rm); saveCart(); openCart();
    });
    document.getElementById('btnCheckout').onclick = ()=>{ close('shCart'); openForm(); };
  }
  open('shCart');
}

/* ---------- FORMULARIO DE PEDIDO ---------- */
function openForm(){
  deliveryMode = null; chosenZone = '';
  document.getElementById('fTitle').textContent = t('yourData');
  document.getElementById('fBody').innerHTML = `
    <div class="dbody">
      <div class="field">
        <label>${t('name')}</label>
        <input id="fName" autocomplete="name">
        <div class="err" id="eName">${t('reqName')}</div>
      </div>
      <div class="field">
        <label>${t('phone')}</label>
        <input id="fPhone" type="tel" autocomplete="tel">
        <div class="err" id="ePhone">${t('reqPhone')}</div>
      </div>

      <div class="lbl">${t('how')}</div>
      <div class="opts">
        <button class="opt" data-mode="envio">
          <div class="ic">📦</div>
          <div class="ti">${t('ship')}</div>
          <div class="su">${t('shipSub')}</div>
        </button>
        <button class="opt" data-mode="personal">
          <div class="ic">🤝</div>
          <div class="ti">${t('pick')}</div>
          <div class="su">${t('pickSub')}</div>
        </button>
      </div>
      <div class="err" id="eHow" style="margin-top:-8px;margin-bottom:14px">${t('reqHow')}</div>

      <div id="boxShip" class="hide">
        <div class="field">
          <label>${t('addr')}</label>
          <textarea id="fAddr" placeholder="${t('addrPh')}" autocomplete="street-address"></textarea>
          <div class="err" id="eAddr">${t('reqAddr')}</div>
        </div>
      </div>

      <div id="boxPick" class="hide">
        <div class="note">${t('pickNote')}</div>
      </div>

      <div class="totrow"><span class="l">${t('total')}</span><span class="v">${money(total())}</span></div>
      <button class="add" id="btnSend">${t('send')}</button>
      <div class="err" id="eSend" style="text-align:center;margin-top:12px">${t('failed')}</div>
    </div>`;

  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    deliveryMode = b.dataset.mode;
    document.getElementById('eHow').classList.remove('on');
    document.getElementById('boxShip').classList.toggle('hide', deliveryMode!=='envio');
    document.getElementById('boxPick').classList.toggle('hide', deliveryMode!=='personal');
  });

  document.getElementById('btnSend').onclick = submit;
  open('shForm');
}

async function submit(){
  const name  = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const addrEl = document.getElementById('fAddr');
  const addr  = addrEl ? addrEl.value.trim() : '';
  document.getElementById('eName').classList.toggle('on', !name);
  document.getElementById('ePhone').classList.toggle('on', !phone);
  document.getElementById('eHow').classList.toggle('on', !deliveryMode);
  if(deliveryMode==='envio') document.getElementById('eAddr').classList.toggle('on', !addr);

  if(!name || !phone || !deliveryMode) return;
  if(deliveryMode==='envio' && !addr) return;

  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> ${t('sending')}`;
  document.getElementById('eSend').classList.remove('on');

  const isShip = deliveryMode==='envio';
  const place  = isShip ? addr : t('pick');
  const label  = isShip ? t('ship') : t('pick');

  try{
    const { data: num, error } = await sb.rpc('create_order', {
      p_store_id: STORE_ID,
      p_name: name,
      p_phone: phone,
      p_address: isShip ? addr : null,
      p_items: cart.map(i=>({product_id:i.id,name:i.name,size:i.size,qty:i.qty,price:i.price})),
      p_total: total(),
      p_note: isShip ? 'Envío' : 'Personal'
    });
    if(error) throw error;
    const lines = cart.map(i=>`• ${i.qty}x ${i.name}${i.size?` (${i.size})`:''} — ${money(i.price*i.qty)}`).join('\n');
    const msg = encodeURIComponent(
      `Hola! Hice el pedido *${num}*\n\n${lines}\n\n*${t('total')}: ${money(total())}*\n\n${name}\n${phone}\n\n*${isShip ? label + ':' : label}* ${isShip ? place : ''}`
    );
    const wa = `https://wa.me/${store.whatsapp}?text=${msg}`;

    document.getElementById('fBody').innerHTML = `
      <div class="done">
        <div class="ok">✓</div>
        <h3>${t('done')}</h3>
        <div class="num">${esc(num)}</div>
        <p>${t('doneSub')}</p>
        <a class="add" style="display:block;text-decoration:none;text-align:center" href="${wa}" target="_blank">${t('toWa')}</a>
      </div>`;
    cart = []; saveCart();
  }catch(e){
    console.error(e);
    document.getElementById('eSend').classList.add('on');
    btn.disabled = false; btn.textContent = t('send');
  }
}

/* ---------- UI ---------- */
const open  = id => document.getElementById(id).classList.add('on');
const close = id => document.getElementById(id).classList.remove('on');
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.sheet').classList.remove('on'));
document.getElementById('btnCart').onclick = openCart;
document.getElementById('btnSearch').onclick = ()=>{
  const w = document.getElementById('searchWrap');
  w.classList.toggle('on');
  if(w.classList.contains('on')) document.getElementById('q').focus();
  else { query=''; document.getElementById('q').value=''; render(); }
};
document.getElementById('q').oninput = e=>{ query = e.target.value.trim(); render(); };
document.getElementById('btnLang').onclick = ()=>{
  lang = lang==='es' ? 'en' : 'es';
  document.getElementById('btnLang').textContent = lang.toUpperCase();
  document.getElementById('q').placeholder = t('search');
  renderCats(); render(); saveCart();
};

load();
</script>
